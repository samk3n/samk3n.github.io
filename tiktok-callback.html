<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TikTok OAuth Callback</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;line-height:1.5;color:#222}
  h1{font-size:1.25rem}
  .box{background:#f4f4f5;border:1px solid #d4d4d8;border-radius:8px;padding:1rem;margin:1rem 0;font-family:ui-monospace,Consolas,monospace;font-size:0.9rem;word-break:break-all;white-space:pre-wrap}
  button{font:inherit;padding:0.5rem 1rem;border:1px solid #222;background:#222;color:#fff;border-radius:6px;cursor:pointer}
  button:hover{background:#000}
  .err{color:#b00}
  .ok{color:#067}
  label{font-size:0.85rem;color:#555;display:block;margin-top:1rem}
</style>
</head>
<body>
<h1>TikTok OAuth Callback</h1>

<div id="result">Reading authorization response…</div>

<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const errorDesc = params.get('error_description');
  const result = document.getElementById('result');

  if (error) {
    result.innerHTML = `<p class="err"><strong>Error:</strong> ${error}</p><p>${errorDesc || ''}</p>`;
  } else if (code) {
    result.innerHTML = `
      <p class="ok">✓ Authorization successful. Copy the code below and paste it into your local script.</p>
      <label>Authorization code</label>
      <div class="box" id="code">${code}</div>
      <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent).then(()=>this.textContent='Copied!')">Copy code</button>
      ${state ? `<label>State (for verification)</label><div class="box">${state}</div>` : ''}
      <p style="margin-top:2rem;font-size:0.85rem;color:#555">You can close this tab once you've pasted the code.</p>
    `;
  } else {
    result.innerHTML = `<p class="err">No authorization code or error in the URL. Did you arrive here directly?</p>`;
  }
</script>
</body>
</html>
